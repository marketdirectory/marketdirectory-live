name: E11B2 Apply Transport

on:
  push:
    branches: [main]
    paths:
      - .github/e11b2-live-trigger.json

permissions:
  contents: write

concurrency:
  group: e11b2-live-apply
  cancel-in-progress: false

jobs:
  apply-live-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROLLBACK_SHA: 2bfc48e053636d747f6ae51a9945a83b56eeed2b
      TRANSPORT_REPO: marketdirectory/marketdirectory-staging
      TRANSPORT_BRANCH: e11b2-live-dist-transport
      REQUIRED_SOURCE_SHA: 37d7fe8aa5c1eb96ae1957dfd931adf37caf84c0
      EXPECTED_BUNDLE: assets/index-BDt0PV_T.js
      EXPECTED_CSS: assets/index-D66afFJ5.css
    steps:
      - name: Checkout live repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify rollback boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          mapfile -t changed < <(git diff --name-only "${ROLLBACK_SHA}..HEAD" | sort)
          printf 'Changes above rollback SHA:\n%s\n' "${changed[*]}"
          expected=(
            ".github/e11b2-live-trigger.json"
            ".github/workflows/e11b2-apply-transport.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Checkout verified public transport branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRANSPORT_REPO }}
          ref: ${{ env.TRANSPORT_BRANCH }}
          path: transport
          fetch-depth: 1

      - name: Verify transport metadata and bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f transport/deploy-info.json
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('transport/deploy-info.json','utf8'));
          const expected = {
            sourceRepository: 'marketdirectory/marketdirectory',
            sourceSha: process.env.REQUIRED_SOURCE_SHA,
            distBundle: process.env.EXPECTED_BUNDLE,
            distCss: process.env.EXPECTED_CSS,
            transportOnly: true,
          };
          for (const [key,value] of Object.entries(expected)) {
            if (info[key] !== value) throw new Error(`${key} mismatch: ${info[key]} !== ${value}`);
          }
          NODE
          test -f "transport/${EXPECTED_BUNDLE}"
          test -f "transport/${EXPECTED_CSS}"
          test -f transport/index.html
          test -f transport/.htaccess
          test -f transport/sitemap-markets.xml
          grep -Fq "${EXPECTED_BUNDLE}" transport/index.html
          grep -Fq "${EXPECTED_CSS}" transport/index.html
          ! grep -Fq '/market/test-marklet-123<' transport/sitemap-markets.xml
          ! grep -Fq '/market/riverside-farmers-market<' transport/sitemap-markets.xml
          grep -Fq '/market/riverside-market<' transport/sitemap-markets.xml

      - name: Sync verified dist into live repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'assets' \
            ! -name 'CNAME' \
            ! -name 'asset-retention.json' \
            ! -name 'transport' \
            -exec rm -rf {} +
          mkdir -p assets
          rsync -a \
            --exclude='.git/' \
            --exclude='assets/' \
            --exclude='CNAME' \
            --exclude='asset-retention.json' \
            transport/ ./
          rsync -a transport/assets/ assets/
          rm -rf transport
          test -f "${EXPECTED_BUNDLE}"
          test -f "${EXPECTED_CSS}"
          test -f index.html
          test -f .htaccess
          test -f sitemap-markets.xml
          grep -Fq "${EXPECTED_BUNDLE}" index.html
          grep -Fq "${EXPECTED_CSS}" index.html
          ! grep -Fq '/market/test-marklet-123<' sitemap-markets.xml
          ! grep -Fq '/market/riverside-farmers-market<' sitemap-markets.xml
          grep -Fq '/market/riverside-market<' sitemap-markets.xml

      - name: Commit live release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketdirectory"
          git config user.email "admin@marketdirectory.co.uk"
          git add -A
          git commit -m "deploy(live): E11B2 release ${REQUIRED_SOURCE_SHA::7}"
          git push origin main
          echo "LIVE_RELEASE_SHA=$(git rev-parse HEAD)"
          echo "ROLLBACK_SHA=${ROLLBACK_SHA}"
          echo "BUNDLE=${EXPECTED_BUNDLE}"
