name: E11B2 Hosted Verify

on:
  push:
    branches: [main]
    paths:
      - .github/e11b2-hosted-verify-trigger.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://marketdirectory.co.uk
      EXPECTED_BUNDLE: assets/index-BDt0PV_T.js
      EXPECTED_SOURCE_SHA: 37d7fe8aa5c1eb96ae1957dfd931adf37caf84c0
    steps:
      - name: Diagnose hosted bundle and sitemap
        shell: bash
        run: |
          set -euo pipefail
          bust="e11b2-diagnostic=${GITHUB_SHA}-$(date +%s)"
          index=$(mktemp)
          info=$(mktemp)
          sitemap=$(mktemp)
          index_status=$(curl -L -sS --connect-timeout 10 --max-time 25 -o "$index" -w '%{http_code}' "${SITE_URL}/?${bust}" || true)
          info_status=$(curl -L -sS --connect-timeout 10 --max-time 25 -o "$info" -w '%{http_code}' "${SITE_URL}/deploy-info.json?${bust}" || true)
          sitemap_status=$(curl -L -sS --connect-timeout 10 --max-time 25 -o "$sitemap" -w '%{http_code}' "${SITE_URL}/sitemap-markets.xml?${bust}" || true)
          echo "http index=$index_status info=$info_status sitemap=$sitemap_status"
          bundle=0; source=0; no_test=0; no_old_riverside=0; has_riverside=0
          grep -Fq "${EXPECTED_BUNDLE}" "$index" && bundle=1 || true
          grep -Fq "${EXPECTED_SOURCE_SHA}" "$info" && source=1 || true
          if ! grep -Fq '/market/test-marklet-123<' "$sitemap"; then no_test=1; fi
          if ! grep -Fq '/market/riverside-farmers-market<' "$sitemap"; then no_old_riverside=1; fi
          grep -Fq '/market/riverside-market<' "$sitemap" && has_riverside=1 || true
          echo "checks bundle=$bundle source_sha=$source no_test=$no_test no_old_riverside=$no_old_riverside has_riverside=$has_riverside"
          echo "index_assets=$(grep -Eo 'assets/index-[A-Za-z0-9_-]+\.js' "$index" | sort -u | tr '\n' ' ')"
          echo "deploy_info=$(tr -d '\n\r' < "$info" | head -c 1000)"
          echo "sitemap_test_count=$(grep -Fc '/market/test-marklet-123<' "$sitemap" || true)"
          echo "sitemap_old_riverside_count=$(grep -Fc '/market/riverside-farmers-market<' "$sitemap" || true)"
          echo "sitemap_riverside_count=$(grep -Fc '/market/riverside-market<' "$sitemap" || true)"
          test "$index_status" = 200
          test "$info_status" = 200
          test "$sitemap_status" = 200
          rm -f "$index" "$info" "$sitemap"
